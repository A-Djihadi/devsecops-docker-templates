# Main nginx configuration for the reverse proxy container.
#
# Runs unprivileged (`user: nginx`) with a read-only root filesystem:
#   - pid and temp paths live on tmpfs (/tmp)
#   - logs go to stdout/stderr instead of /var/log/nginx
#   - non-privileged listen port 8080 (see conf.d/default.conf)

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
