# Development overrides — automatically merged with docker-compose.yml by
# Docker Compose. NOT for production.
#
# Purpose:
#   - build the app image locally instead of pulling it
#   - mount the source tree for hot-reload
#   - publish app/db ports directly on the host for debugging
#   - disable restart policies so crashes are visible immediately

services:
  app:
    # Build locally and tag a dev image instead of pulling the production image.
    image: ${COMPOSE_PROJECT_NAME:-myproject}-app:dev
    build:
      context: ..
      dockerfile: ${APP_DOCKERFILE:-Dockerfile}
    # Mount the source tree for hot-reload (adapt the path to your stack).
    volumes:
      - ../src:/app/src
      - app-logs:/app/logs
    # Expose the app directly for curl/Postman testing.
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: "no"
    environment:
      NODE_ENV: development

  db:
    # Expose PostgreSQL for a local client (DBeaver, psql, ...).
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: "no"

  proxy:
    restart: "no"
